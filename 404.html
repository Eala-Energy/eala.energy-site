<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — eala energy</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07111f; --text:#ebf3ff; --muted:#9fb4d4;
      --cyan:#5dd7ff; --line:rgba(103,177,255,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; flex-direction:column;
      font-family:Inter,system-ui,sans-serif; color:var(--text); line-height:1.7;
      background:
        radial-gradient(circle at 15% 20%, rgba(62,123,255,.12), transparent 0 28%),
        radial-gradient(circle at 84% 24%, rgba(93,215,255,.12), transparent 0 22%),
        linear-gradient(180deg, #07111f 0%, #081527 30%, #09192d 100%);
    }
    main{flex:1; display:grid; place-items:center; padding:48px 24px; text-align:center}
    img{filter:drop-shadow(0 0 16px rgba(93,215,255,.18))}
    h1{font-size:clamp(32px, 6vw, 48px); letter-spacing:-.04em; margin:18px 0 10px}
    p{color:var(--muted); margin:0 0 24px}
    a{color:var(--cyan)}
    .btn{
      display:inline-block; padding:14px 18px; border-radius:999px; text-decoration:none; font-weight:700;
      color:#031322; background:linear-gradient(135deg, var(--cyan), #a2edff);
      box-shadow:0 10px 32px rgba(93,215,255,.22);
    }
    footer{
      border-top:1px solid var(--line); color:var(--muted);
      padding:24px; font-size:14px; text-align:center;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="/logo.png" alt="eala energy logo" width="96" height="96">
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.<br>
      Questions? Email <a href="mailto:info@eala.energy">info@eala.energy</a>.</p>
      <a class="btn" href="/">Back to eala energy</a>
    </div>
  </main>
  <footer>© 2026 eala energy</footer>
</body>
</html>
