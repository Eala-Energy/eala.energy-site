<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — eala energy</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Source Serif 4, Public Sans (SIL OFL 1.1, fonts/OFL-*.txt), self-hosted */
    @font-face{font-family:'Source Serif 4'; font-style:normal; font-weight:600; font-display:swap; src:url(/fonts/source-serif-4-latin.woff2) format('woff2'); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
    @font-face{font-family:'Public Sans'; font-style:normal; font-weight:400 600; font-display:swap; src:url(/fonts/public-sans-latin.woff2) format('woff2'); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
    :root{
      --b-paper:#EEECE6; --b-sheet:#F7F6F2; --b-ink:#17191C; --b-ink-2:#4F545A; --b-rule:#C8C4BA;
      --b-slate:#35546F; --b-slate-deep:#27425A;
      --f-serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
      --f-sans:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    *{box-sizing:border-box}
    ::selection{background:#D3DCE4; color:var(--b-ink)}
    a{color:var(--b-slate); text-underline-offset:3px}
    a:hover{color:var(--b-slate-deep)}
    a:focus-visible{outline:2px solid var(--b-ink); outline-offset:3px; border-radius:1px}
    body{margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:var(--f-sans); color:var(--b-ink); background:var(--b-paper); line-height:1.65; -webkit-font-smoothing:antialiased}
    main{flex:1; display:grid; place-items:center; padding:48px max(16px, 4vw); text-align:center}
    h1{font:600 clamp(2.25rem, 5vw, 3rem)/1.08 var(--f-serif); letter-spacing:-0.015em; margin:16px 0 12px}
    p{color:var(--b-ink-2); margin:0 0 28px}
    .btn{
      display:inline-flex; align-items:center; min-height:48px; padding:0 22px; border-radius:2px; text-decoration:none;
      font-weight:600; color:var(--b-sheet); background:var(--b-slate); border:1px solid var(--b-slate);
    }
    .btn:hover{color:var(--b-sheet); background:var(--b-slate-deep)}
    footer{border-top:1px solid var(--b-rule); color:var(--b-ink-2); padding:28px; font-size:0.875rem; text-align:center}
  </style>
</head>
<body>
  <main>
    <div>
      <img src="/logo.png" alt="eala energy logo" width="96" height="96">
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.<br>
      Questions? Email <a href="mailto:info@eala.energy">info@eala.energy</a>.</p>
      <a class="btn" href="/">Back to eala energy</a>
    </div>
  </main>
  <footer>© 2026 eala energy</footer>
</body>
</html>
